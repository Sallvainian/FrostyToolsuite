# Builds the Linux packages (AppImage, tar.gz, tar.xz, deb, rpm, pkg.tar.zst) and publishes them as a GitHub release.
name: Linux release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4.1.1
    - name: Setup .NET
      uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: 8.0
    - name: Build packages
      run: packaging/linux/build.sh "${GITHUB_REF_NAME#v}"
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=""
        case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$GITHUB_REF_NAME" packaging/linux/dist/* $prerelease \
          --title "Frosty Mod Manager $GITHUB_REF_NAME for Linux" \
          --notes-file packaging/linux/release-notes.md
